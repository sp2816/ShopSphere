<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Flipkart Clone</title>
  <link rel="stylesheet" href="../css/contactUs.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div class="contact-container">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you. Please fill out the form below.</p>

    <form action="#" method="post" class="contact-form">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required placeholder="Enter your full name">

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required placeholder="Enter your email">

      <label for="message">Your Message</label>
      <textarea id="message" name="message" rows="5" required placeholder="Type your message here..."></textarea>

      <button type="submit">Send Message</button>
    </form>

    <div class="contact-info">
      <h2>Customer Care</h2>
      <p><i class="fas fa-envelope"></i> support@shopsphere.com</p>
      <p><i class="fas fa-phone"></i> +91 98765 43210</p>
      <p><i class="fas fa-map-marker-alt"></i> 123, Tech Street, Bengaluru, India</p>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2025 ShopSphere Clone. All rights reserved.</p>
    <p>
      <a href="aboutus.html">About</a> |
      <a href="customercare.html">Contact</a> |
      <a href="terms.html">Terms</a> |
      <a href="privacy.html">Privacy</a>
    </p>
  </footer>

</body>
</html>
