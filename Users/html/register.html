<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="../css/register.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <header class="main-header">
    <div class="logo">ShopSphere <span class="plus">Explore Plus ✨</span></div>

    <div class="search-bar">
      <input type="text" placeholder="Search for Products, Brands and More">
      <i class="fas fa-search"></i>
    </div>
  </header>

  <a href="../php/homepage.php" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>

  <div class="register-container">
    <h1>Create Your Account</h1>

  <form id="registerForm" action="../php/register.php" method="post" class="register-form" target="_self">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="email">Email or Mobile Number</label>
      <input type="email" id="email" name="email" placeholder="Enter your email or phone" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter a password" required>

      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>

      <button type="submit">Register</button>

      <p class="register-extra">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </form>
  </div>

  <footer class="site-footer">
    <p>&copy; 2025 Flipkart Clone. All rights reserved.</p>
    <p>
      <a href="aboutus.html">About</a> |
      <a href="customercare.html">Contact</a> |
      <a href="terms.html">Terms</a> |
      <a href="privacy.html">Privacy</a>
    </p>
  </footer>
  <!-- JS validation removed. All registration logic is now handled by PHP. -->
</body>
</html>
