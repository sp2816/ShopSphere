<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Cart</title>
  <link rel="stylesheet" href="../css/cart.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <header class="main-header">
    <div class="logo">ShopSphere <span class="plus">Explore Plus ✨</span></div>

    <div class="search-bar">
      <input type="text" placeholder="Search for Products, Brands and More">
      <i class="fas fa-search"></i>
    </div>
  </header>

  <a href="../html/homepage.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>

  <main class="cart-container">
    <h1>My Cart</h1>

    <div class="cart-item">
      <img src="../images/earpods.jpg" alt="Earbuds">
      <div class="item-info">
        <h3>Wireless Earbuds</h3>
        <p>Brand: Noise</p>
        <p>₹1,499</p>
        <div class="qty">
          <button>-</button>
          <span>1</span>
          <button>+</button>
        </div>
      </div>
      <button class="remove-btn">Remove</button>
    </div>

    <div class="cart-item">
      <img src="../images/watch.jpg" alt="Watch">
      <div class="item-info">
        <h3>Smart Watch</h3>
        <p>Brand: Noise</p>
        <p>₹2,499</p>
        <div class="qty">
          <button>-</button>
          <span>1</span>
          <button>+</button>
        </div>
      </div>
      <button class="remove-btn">Remove</button>
    </div>

    <div class="cart-summary">
      <h2>Total: ₹3,998</h2>
      <button class="checkout-btn">Proceed to Checkout</button>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 ShopSphere Clone. All rights reserved.</p>
    <p>
      <a href="aboutus.html">About</a> |
      <a href="customercare.html">Contact</a> |
      <a href="terms.html">Terms</a> |
      <a href="privacy.html">Privacy</a>
    </p>
  </footer>

  <script src="../js/cart.js"></script>

</body>
</html>
